name: Build NeuraFlow Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Ambil Kode dari Repositori
        uses: actions/checkout@v4

      - name: 2. Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Siapkan Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Bungkus Proyek Web ke Android (Capacitor)
        run: |
          mkdir -p www
          cp index.html style.css app.js www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "NeuraFlow AI" "com.neuraflow.studio" --web-dir=www
          npx cap add android

      - name: 5. Buat Ikon Aplikasi Android Otomatis
        run: |
          pip install pillow
          python3 - << 'EOF'
          import os
          from PIL import Image, ImageDraw

          def create_icon(size):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              pad = int(size * 0.03)
              rad = int(size * 0.22)

              # Background gelap membulat & bingkai neon
              draw.rounded_rectangle([pad, pad, size - pad, size - pad], radius=rad, fill=(15, 23, 42, 255), outline=(56, 189, 248, 255), width=max(2, size // 36))

              # Lingkaran lensa kamera
              cx, cy = size // 2, size // 2
              r_outer = int(size * 0.28)
              r_inner = int(size * 0.20)
              draw.ellipse([cx - r_outer, cy - r_outer, cx + r_outer, cy + r_outer], outline=(129, 140, 248, 255), width=max(3, size // 24))
              draw.ellipse([cx - r_inner, cy - r_inner, cx + r_inner, cy + r_inner], fill=(9, 10, 15, 255))

              # Segitiga Play di tengah lensa
              tri = [
                  (cx - int(size * 0.05), cy - int(size * 0.10)),
                  (cx + int(size * 0.10), cy),
                  (cx - int(size * 0.05), cy + int(size * 0.10))
              ]
              draw.polygon(tri, fill=(232, 121, 249, 255))
              return img

          res_dir = "android/app/src/main/res"
          anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
          if os.path.exists(anydpi):
              for f in os.listdir(anydpi):
                  os.remove(os.path.join(anydpi, f))

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, px in densities.items():
              target = os.path.join(res_dir, folder)
              os.makedirs(target, exist_ok=True)
              icon = create_icon(px)
              icon.save(os.path.join(target, "ic_launcher.png"))
              icon.save(os.path.join(target, "ic_launcher_round.png"))
          EOF

      - name: 6. Tambahkan Izin Internet & Audio di AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' $MANIFEST

      - name: 7. Compile File APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Hasil APK Siap Unduh
        uses: actions/upload-artifact@v4
        with:
          name: NeuraFlow-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
